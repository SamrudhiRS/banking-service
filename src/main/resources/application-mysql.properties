# Activate with: --spring.profiles.active=mysql
# Values can be overridden with environment variables (used by docker-compose).
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/bank_db}
spring.datasource.username=${DB_USERNAME:bank}
spring.datasource.password=${DB_PASSWORD:bankpass}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=false
