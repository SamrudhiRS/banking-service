server.port=9096

# Default profile: in-memory H2 database (data is lost on restart).
# For persistent storage run with the "mysql" profile (see README).
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.url=jdbc:h2:mem:bank_db
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.show-sql=true

# Development convenience only - disable for production
spring.h2.console.enabled=true
