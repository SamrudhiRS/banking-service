services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: bank_db
      MYSQL_USER: bank
      MYSQL_PASSWORD: bankpass
      MYSQL_ROOT_PASSWORD: rootpass
    ports:
      - "3306:3306"
    volumes:
      - bank_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpass"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: mysql
      DB_URL: jdbc:mysql://db:3306/bank_db
      DB_USERNAME: bank
      DB_PASSWORD: bankpass
    ports:
      - "9096:9096"

volumes:
  bank_db_data:
